name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        # Keep in sync with the targets in lib/yaml_rustler.ex. Linux targets build with Cross so
        # the glibc builds link against an old enough glibc to load on e.g. Debian 11 and Ubuntu 20.04.
        job:
          - { target: aarch64-apple-darwin        , os: macos-15 }
          - { target: aarch64-unknown-linux-gnu   , os: ubuntu-22.04 , use-cross: true }
          - { target: aarch64-unknown-linux-musl  , os: ubuntu-22.04 , use-cross: true }
          - { target: arm-unknown-linux-gnueabihf , os: ubuntu-22.04 , use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-apple-darwin         , os: macos-15-intel }
          - { target: x86_64-pc-windows-gnu       , os: windows-2022 }
          - { target: x86_64-pc-windows-msvc      , os: windows-2022 }
          - { target: x86_64-unknown-linux-gnu    , os: ubuntu-22.04 , use-cross: true }
          - { target: x86_64-unknown-linux-musl   , os: ubuntu-22.04 , use-cross: true }

    steps:
      - uses: actions/checkout@v6

      - name: Check the tag matches mix.exs
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MIX_VERSION=$(sed -n 's/^ *@version "\(.*\)"/\1/p' mix.exs | head -n1)
          if [ "$VERSION" != "$MIX_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match @version $MIX_VERSION in mix.exs"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build the NIF
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: yamlrustler
          project-version: ${{ steps.version.outputs.version }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: native/yamlrustler

      - name: Upload NIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz

  # Consumers depend on this repo through git, and rustler_precompiled refuses to download a NIF
  # without a checksum, so the checksum file generated from the released artifacts is committed
  # to main. Depend on the branch (or a commit after this one), not on the tag itself.
  checksums:
    name: Commit checksums
    needs: release
    runs-on: ubuntu-latest
    env:
      # Build the NIF locally so compiling doesn't try to download a NIF whose checksum isn't
      # generated yet.
      YAML_RUSTLER_BUILD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        run: mix deps.get

      - name: Generate checksums from the released artifacts
        run: mix rustler_precompiled.download YamlRustler --all --print

      - name: Commit checksums to main
        run: |
          if git diff --quiet -- checksum-Elixir.YamlRustler.exs; then
            echo "Checksums are already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add checksum-Elixir.YamlRustler.exs
            git commit -m "Update precompiled NIF checksums for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
